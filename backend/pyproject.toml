[project]
name = "fincite-backend"
version = "0.1.0"
description = "AI financial research backend for Indian/NSE annual reports — FastAPI + LlamaIndex + Supabase"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.11",
  "pydantic==2.9.2",
  "uvicorn==0.22.0",
  "sqlalchemy[asyncio]==2.0.19",
  "asyncpg==0.29.0",
  "alembic==1.11.2",
  "psycopg2-binary==2.9.10",
  "sse-starlette==1.6.5",
  "pypdf==5.3.1",
  "anyio==3.7.1",
  "pgvector==0.3.6",
  "sentry-sdk[fastapi]==1.29.2",
  "llama-index-core==0.12.23",
  "nltk==3.9.1",
  "greenlet==2.0.2",
  "pydantic-settings==2.8.1",
  "llama-index-vector-stores-postgres==0.4.2",
  "llama-index-readers-file==0.4.6",
  "llama-index-llms-gemini>=0.5.0",
  "llama-index-embeddings-gemini>=0.3.2",
  "supabase==2.16.0",
  "python-multipart==0.0.9",
  "nest-asyncio==1.6.0",
  "requests==2.32.3",
  "psycopg[binary]>=3.3.4",
  "mako>=1.4.1",
]

[dependency-groups]
dev = [
  "pylint==2.17.5",
  "pytest==7.4.0",
  "pytest-asyncio==0.23.8",
  "httpx==0.27.2",
  "sseclient-py==1.7.2",
  "llama-index-callbacks-arize-phoenix==0.4.0; platform_system != 'Windows'",
  "arize-phoenix==8.12.1; platform_system != 'Windows'",
]

[project.scripts]
start = "app.main:start"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
