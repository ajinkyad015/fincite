# ─────────────────────────────────────────────────────────────────────────────
# Local development docker-compose for fincite backend
#
# NOTE: This compose file is for local development ONLY.
# In production, use Supabase for PostgreSQL + pgvector + Storage (or see
# docker-compose.prod.yml once M5 lands).
#
# To use:
#   1. Copy .env.example to .env and fill in your values
#   2. docker compose up
# ─────────────────────────────────────────────────────────────────────────────

services:
  fincite-backend:
    build:
      context: .
    volumes:
      # Live reload: reflect code changes without rebuild
      - ./:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to point at the local pgvector container
      DATABASE_URL: "postgresql://user:password@db:5432/fincite_db"
      BACKEND_CORS_ORIGINS: '["http://localhost:5173", "http://localhost:8000"]'

  # Local PostgreSQL + pgvector for development without a Supabase project.
  # For storage (PDFs), you still need SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY
  # set in your .env even for local dev.
  db:
    image: ankane/pgvector:v0.5.0
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fincite_db
    ports:
      # Postgres listens on 5432 inside the image — publish it on 5433 on the
      # host so a locally installed Postgres can keep 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d fincite_db"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
